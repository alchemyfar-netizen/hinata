name: Hinata - GitHub Pages

# Builds the customized web app (apps/stage-web) in the cloud and publishes it
# to https://<owner>.github.io/<repo>/, so the laptop never runs the heavy build.

on:
  push:
    branches: [hinata]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hinata-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - uses: pnpm/setup@v2
        with:
          runtime: node@^26.12.1
          cache: true
          install: false
      # onnxruntime-node fetches CUDA binaries on Linux from a link that 404s. The web build does not use them.
      - run: pnpm install --frozen-lockfile
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: pnpm run build:packages
      # Every app icon comes from the one Hinata logo, public/favicon.svg.
      - name: Render Hinata icons
        working-directory: apps/stage-web/public
        run: |
          sudo apt-get install -y --no-install-recommends librsvg2-bin imagemagick >/dev/null
          rsvg-convert -w 180 -h 180 favicon.svg -o apple-touch-icon.png
          rsvg-convert -w 192 -h 192 favicon.svg -o web-app-manifest-192x192.png
          rsvg-convert -w 512 -h 512 favicon.svg -o web-app-manifest-512x512.png
          rsvg-convert -w 192 -h 192 favicon.svg -o maskable_icon_x192.png
          rsvg-convert -w 512 -h 512 favicon.svg -o maskable_icon_x512.png
          rsvg-convert -w 48 -h 48 favicon.svg -o /tmp/favicon-48.png
          convert /tmp/favicon-48.png favicon.ico
      - name: Build stage-web
        run: pnpm -F @proj-airi/stage-web run build --base=/${{ github.event.repository.name }}/
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          VITE_HINATA_SUPABASE_URL: ${{ vars.VITE_HINATA_SUPABASE_URL }}
          VITE_HINATA_SUPABASE_KEY: ${{ vars.VITE_HINATA_SUPABASE_KEY }}
          VITE_HINATA_ACCESS_KEY: ${{ secrets.VITE_HINATA_ACCESS_KEY }}
      # GitHub Pages has no SPA fallback: serve the app for unknown paths too.
      - run: cp apps/stage-web/dist/index.html apps/stage-web/dist/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/stage-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
